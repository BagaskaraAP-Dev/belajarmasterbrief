name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  quality:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 26 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install pnpm
        run: npm i -g pnpm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || (pnpm approve-builds --all && pnpm install)

      - name: Prisma Client Generate
        run: pnpm db:generate

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript Typecheck
        run: pnpm typecheck

      - name: Run Vitest Unit Tests
        run: pnpm test

      - name: Build Next.js Application
        run: pnpm build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_WA_NUMBER: 6281234567890
          DATABASE_URL: postgresql://umkm_user:umkm_password@localhost:5432/umkm_db

  docker-build:
    name: Docker Image Build Test
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Runner Image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runner
          push: false
          tags: umkm-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
