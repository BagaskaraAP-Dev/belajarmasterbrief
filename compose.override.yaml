services:
  db:
    ports:
      - "127.0.0.1:5432:5432"

  migrate:
    environment:
      RUN_SEED: "true"

  web:
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      - uploads:/app/uploads
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: rebuild
          path: ./package.json
