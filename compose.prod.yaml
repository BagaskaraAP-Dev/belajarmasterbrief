services:
  db:
    restart: unless-stopped
    ports: [] # PostgreSQL internal only, not exposed to internet
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M

  migrate:
    restart: "no"
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      target: runner
    restart: unless-stopped
    ports: [] # Handled strictly through Caddy reverse proxy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  caddy_data: {}
  caddy_config: {}
